<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Purchase Orders</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="main">
    <div class="page-head">
        <div>
            <p class="eyebrow">Purchase Management</p>
            <h1>Purchase Orders</h1>
            <p>Track orders placed with suppliers and confirm what arrives.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/purchase-orders/new}">+ New Purchase Order</a>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
            <tr>
                <th>PO ID</th>
                <th>Supplier</th>
                <th>Order Date</th>
                <th>Status</th>
                <th>Total Cost</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="po : ${purchaseOrders}">
                <td class="cell-mono" th:text="${po.poId}">1</td>
                <td class="cell-name" th:text="${po.supplier.supplierName}">Supplier</td>
                <td th:text="${po.orderDate}">2026-01-01</td>
                <td>
                    <span class="badge status-pending" th:if="${po.status == 'PENDING'}" th:text="${po.status}"></span>
                    <span class="badge status-partial" th:if="${po.status == 'PARTIALLY_RECEIVED'}" th:text="${po.status}"></span>
                    <span class="badge status-completed" th:if="${po.status == 'COMPLETED'}" th:text="${po.status}"></span>
                </td>
                <td th:text="${po.totalCost}">0.00</td>
                <td class="cell-actions">
                    <a class="btn btn-ghost btn-sm" th:href="@{/purchase-orders/{id}(id=${po.poId})}">View / Receive</a>
                </td>
            </tr>
            </tbody>
        </table>
        <div class="empty-state" th:if="${#lists.isEmpty(purchaseOrders)}">
            <div class="glyph">—</div>
            <p>No purchase orders yet.</p>
        </div>
    </div>
</div>
</body>
</html>
