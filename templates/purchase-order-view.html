<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Purchase Order Details</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="main">
    <div class="page-head">
        <div>
            <p class="eyebrow">Purchase Management</p>
            <h1>Purchase Order #<span th:text="${po.poId}"></span></h1>
        </div>
        <a class="btn btn-ghost" th:href="@{/purchase-orders}">← Back to list</a>
    </div>

    <div class="stat-grid">
        <div class="stat-card">
            <div class="stat-label">Supplier</div>
            <div class="stat-value" style="font-size:18px;" th:text="${po.supplier.supplierName}"></div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Status</div>
            <div class="stat-value" style="font-size:18px;" th:text="${po.status}"></div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Order Date</div>
            <div class="stat-value" style="font-size:18px;" th:text="${po.orderDate}"></div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Total Cost</div>
            <div class="stat-value" style="font-size:18px;" th:text="${po.totalCost}"></div>
        </div>
    </div>

    <div class="card card-pad">
        <h3 class="mt-0">Ordered Items — confirm what actually arrived</h3>
        <form th:action="@{/purchase-orders/{id}/receive(id=${po.poId})}" method="post">

            <div class="field" style="max-width:300px;">
                <label>Received by</label>
                <select name="userId" required>
                    <option th:each="u : ${users}" th:value="${u.id}" th:text="${u.fullName}"></option>
                </select>
            </div>

            <div class="table-wrap" style="margin:14px 0;">
                <table>
                    <thead>
                    <tr><th>Medicine</th><th>Ordered Qty</th><th>Unit Cost</th><th>Received Qty</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="item : ${po.items}">
                        <td class="cell-name" th:text="${item.medicine.medName}"></td>
                        <td th:text="${item.orderedQty}"></td>
                        <td th:text="${item.unitCost}"></td>
                        <td>
                            <input type="hidden" name="poItemIds" th:value="${item.poItemId}"/>
                            <input type="number" name="receivedQtys" min="0" th:max="${item.orderedQty}"/>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <button class="btn btn-primary" type="submit">Confirm Receipt</button>
        </form>
    </div>
</div>
</body>
</html>
