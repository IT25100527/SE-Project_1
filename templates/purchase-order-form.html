<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>New Purchase Order</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="main">
    <div class="page-head">
        <div>
            <p class="eyebrow">Purchase Management</p>
            <h1>New Purchase Order</h1>
        </div>
        <a class="btn btn-ghost" th:href="@{/purchase-orders}">← Back to list</a>
    </div>

    <div class="card card-pad">
        <form th:action="@{/purchase-orders}" method="post">

            <div class="field-row">
                <div class="field">
                    <label>Supplier</label>
                    <select name="supplierId" required>
                        <option th:each="s : ${suppliers}" th:value="${s.id}" th:text="${s.supplierName}"></option>
                    </select>
                </div>
                <div class="field">
                    <label>Ordered by</label>
                    <select name="userId" required>
                        <option th:each="u : ${users}" th:value="${u.id}" th:text="${u.fullName}"></option>
                    </select>
                </div>
            </div>

            <h3>Items</h3>
            <div class="table-wrap" style="margin-bottom:16px;">
                <table id="itemsTable">
                    <thead>
                    <tr><th>Medicine</th><th>Quantity</th><th>Unit Cost</th></tr>
                    </thead>
                    <tbody id="itemsBody">
                    <tr>
                        <td>
                            <select name="medicineIds">
                                <option th:each="m : ${medicines}" th:value="${m.medId}" th:text="${m.medName}"></option>
                            </select>
                        </td>
                        <td><input type="number" name="quantities" min="1" required/></td>
                        <td><input type="number" name="unitCosts" step="0.01" min="0" required/></td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <button class="btn btn-ghost btn-sm" type="button" onclick="addRow()">+ Add another item</button>
            <br/><br/>

            <button class="btn btn-primary" type="submit">Save Purchase Order</button>
        </form>
    </div>
</div>

<script th:inline="javascript">
    function addRow() {
        const firstRow = document.querySelector('#itemsBody tr');
        const newRow = firstRow.cloneNode(true);
        newRow.querySelectorAll('input').forEach(i => i.value = '');
        document.getElementById('itemsBody').appendChild(newRow);
    }
</script>
</body>
</html>
