<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Customer Login · Pharmacy Management System</title>
<link rel="stylesheet" href="/css/main.css">
</head>
<body>
<div class="login-shell">
  <div class="login-card">
    <div class="login-mark"><span class="rx">Rx<sup>+</sup></span></div>
    <h1>Customer Login</h1>
    <p class="lede">Sign in to order medicines and track your deliveries.</p>

    <form id="loginForm">
      <div class="field" id="emailField">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
        <div class="error"></div>
      </div>
      <div class="field" id="passwordField">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
        <div class="error"></div>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Log In</button>
    </form>

    <p class="login-foot">
      New here? <a href="/customer/register.html" style="color:var(--primary); font-weight:500;">Create an account</a><br>
      Staff member? <a href="/manager/login.html" style="color:var(--primary); font-weight:500;">Go to staff login</a>
    </p>
  </div>
</div>
<div class="toast-stack" id="toastStack"></div>
<script src="/js/common.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  clearErrors(['emailField', 'passwordField']);
  try {
    const res = await postJson('/customer/login', {
      email: document.getElementById('email').value.trim(),
      password: document.getElementById('password').value
    });
    showToast(res.message, 'success');
    setTimeout(() => window.location.href = '/dashboard', 600);
  } catch (err) {
    handleErrorResponse(err, ['emailField', 'passwordField']);
  }
});
</script>
</body>
</html>
