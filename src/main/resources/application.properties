spring.application.name=pharmacy-management-system

# ---------- Server ----------
server.port=8080
server.error.include-message=always
server.servlet.session.timeout=60m

# ---------- MySQL / Aiven ----------
spring.datasource.url=jdbc:mysql://pharmacy-mysql-pharmacy-management-system.a.aivencloud.com:26797/defaultdb?ssl-mode=REQUIRED
spring.datasource.username=avnadmin
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---------- Mail ----------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---------- Application ----------
app.mail.from=${MAIL_USERNAME}
app.frontend.base-url=http://localhost:8080
app.email-verification.token-expiry-minutes=30
app.default-admin.email=admin@pharmacy.com
app.default-admin.password=${DEFAULT_ADMIN_PASSWORD}